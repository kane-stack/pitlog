name: Pitlog

options:
  bundleIdPrefix: com.kane
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ZXBCH8F6UU
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  PitlogCore:
    path: Packages/PitlogCore

targets:
  Pitlog:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: PitlogCore
    entitlements:
      path: App/Pitlog.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.kane.pitlog
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Pitlog
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - remote-notification
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.kane.pitlog.refresh-reminders
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Pitlog uses the camera to scan your registration certificate and workshop receipts. Images stay on your device.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kane.pitlog
        PRODUCT_NAME: Pitlog
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"

  PitlogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: Pitlog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kane.pitlog.tests
        GENERATE_INFOPLIST_FILE: YES

  PitlogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
    dependencies:
      - target: Pitlog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kane.pitlog.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Pitlog

schemes:
  Pitlog:
    build:
      targets:
        Pitlog: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - PitlogTests
        - PitlogUITests
        - package: PitlogCore/PitlogCoreTests
