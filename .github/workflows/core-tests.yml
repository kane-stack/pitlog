name: PitlogCore tests

on:
  push:
    paths:
      - "Packages/PitlogCore/**"
      - ".github/workflows/core-tests.yml"
  pull_request:
    paths:
      - "Packages/PitlogCore/**"
      - ".github/workflows/core-tests.yml"
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test --package-path Packages/PitlogCore
