name: App build

on:
  push:
    branches:
      - "claude/**"
    paths:
      - "App/**"
      - "AppTests/**"
      - "AppUITests/**"
      - "project.yml"
      - "Packages/**"
      - ".github/workflows/app-build.yml"
  workflow_dispatch:
    inputs:
      tours:
        description: "Also run the screenshot tours (slow)"
        type: boolean
        default: false

env:
  # Simulator builds run unsigned, so the CloudKit entitlements are stripped (see CLAUDE.md).
  XCODEBUILD_FLAGS: CODE_SIGNING_ALLOWED=NO

jobs:
  unit-tests:
    name: Build and unit tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          ls /Applications | grep -i xcode || true
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick simulator
        run: |
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              version = tuple(int(p) for p in runtime.split("iOS-")[-1].split("-") if p.isdigit())
              for d in devices:
                  if d["name"].startswith("iPhone") and d.get("isAvailable", True):
                      key = (version, "Pro" not in d["name"] and "SE" not in d["name"])
                      if best is None or key > best[0]:
                          best = (key, d["udid"])
          print(best[1] if best else "")
          ')"
          echo "Simulator: $UDID"
          test -n "$UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Pitlog \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -only-testing:PitlogTests \
            -resultBundlePath "$RUNNER_TEMP/unit.xcresult" \
            $XCODEBUILD_FLAGS 2>&1 | tee "$RUNNER_TEMP/unit.log"
      - name: Summarize errors
        if: failure()
        run: grep -E "error:|Test Case .* failed|Issue recorded|✘| failed \(" "$RUNNER_TEMP/unit.log" | sort -u | cut -c1-400 | head -80 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-xcresult
          path: ${{ runner.temp }}/unit.xcresult

  ui-tests:
    name: UI tests and accessibility audit
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write  # only this job: it commits screenshots to the branch (see "Publish screenshots")
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick simulator
        run: |
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              version = tuple(int(p) for p in runtime.split("iOS-")[-1].split("-") if p.isdigit())
              for d in devices:
                  if d["name"].startswith("iPhone") and d.get("isAvailable", True):
                      key = (version, "Pro" not in d["name"] and "SE" not in d["name"])
                      if best is None or key > best[0]:
                          best = (key, d["udid"])
          print(best[1] if best else "")
          ')"
          echo "Simulator: $UDID"
          test -n "$UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: UI tests
        env:
          SKIP_TOURS: ${{ inputs.tours && '' || '-skip-testing:PitlogUITests/AccessibilityAuditTests/testTourEnglishDefault -skip-testing:PitlogUITests/AccessibilityAuditTests/testTourGermanDefault -skip-testing:PitlogUITests/AccessibilityAuditTests/testTourEnglishLargeText -skip-testing:PitlogUITests/AccessibilityAuditTests/testTourGermanLargeText' }}
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Pitlog \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -only-testing:PitlogUITests \
            $SKIP_TOURS \
            -resultBundlePath "$RUNNER_TEMP/ui.xcresult" \
            $XCODEBUILD_FLAGS 2>&1 | tee "$RUNNER_TEMP/ui.log"
      - name: Summarize errors
        if: failure()
        run: grep -E "AUDIT\[|error:|Test Case .* failed|Issue recorded|✘| failed \(" "$RUNNER_TEMP/ui.log" | sort -u | cut -c1-400 | head -80 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-xcresult
          path: ${{ runner.temp }}/ui.xcresult
      - name: Export attachments (screenshots, audit issues)
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/attachments"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ui.xcresult" --output-path "$RUNNER_TEMP/attachments" > /dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-attachments
          path: ${{ runner.temp }}/attachments
      # The artifact host is blocked in the cloud environment, git is not: commit downscaled PNGs and the
      # audit report below ci-screenshots/ on the dispatched branch. They are removed again after review.
      - name: Publish screenshots
        if: always()
        run: |
          OUT="ci-screenshots/run-${{ github.run_id }}"
          mkdir -p "$OUT"
          python3 - "$RUNNER_TEMP/attachments" "$OUT" <<'PY'
          import json, os, re, shutil, subprocess, sys
          src, out = sys.argv[1], sys.argv[2]
          report = []
          for test in json.load(open(os.path.join(src, "manifest.json"))):
              tname = test["testIdentifier"].split("/")[-1].replace("()", "")
              for a in test.get("attachments", []):
                  human = a.get("suggestedHumanReadableName", "")
                  path = os.path.join(src, a["exportedFileName"])
                  if a["exportedFileName"].endswith(".png"):
                      base = re.sub(r"_\d+_[0-9A-F-]{36}", "", human)
                      dest = os.path.join(out, f"{tname}__{base}")
                      shutil.copy(path, dest)
                      subprocess.run(["sips", "-Z", "1200", dest], capture_output=True)
                  elif a["exportedFileName"].endswith(".txt"):
                      report.append(f"===== {tname} / {human}\n" + open(path).read())
          open(os.path.join(out, "report.txt"), "w").write("\n".join(report))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git commit -m "ci: screenshots and audit report of run ${{ github.run_id }}" || exit 0
          for attempt in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && break
            sleep 5
          done
      - name: Audit summary
        if: always()
        run: grep -E "AUDIT\[|error:.*Audit|failed \(" "$RUNNER_TEMP/ui.log" | sort -u | cut -c1-330 || true
